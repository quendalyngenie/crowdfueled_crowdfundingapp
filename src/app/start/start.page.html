<ion-header [translucent]="true" class="ion-no-border">
  <ion-menu contentId="main-content">
    <ion-header>
      <ion-toolbar>
        <ion-title></ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">This is the menu content.</ion-content>
  </ion-menu>
  <div class="ion-page" id="main-content">
    <ion-header>
      <ion-toolbar>
        <ion-buttons slot="start">
          <ion-menu-button></ion-menu-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
  </div>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-menu contentId="main-content">
    <ion-header>
      <ion-toolbar>
        <ion-title>{{type}}</ion-title> <!-- need to change -->
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      <ion-list lines="none">
        <ion-item [routerLink]="['/start']">
          <ion-label>Home</ion-label>
        </ion-item>
        <ion-item [routerLink]="['/account']">
          <ion-label><ion-icon name="person-outline"></ion-icon> My Account</ion-label>
        </ion-item>
        <ion-item *ngIf="type == 'Business' or 'Fund Finders'" [routerLink]="['/project-listing']">
          <ion-label><ion-icon name="book-outline"></ion-icon> Projects</ion-label>
        </ion-item>
        <ion-item *ngIf="type == 'Investor' or 'General Public'" [routerLink]="['/campaign']">
          <ion-label><ion-icon name="book-outline"></ion-icon> Projects</ion-label>
        </ion-item>
        <ion-item [routerLink]="['/transaction-history']">
          <ion-label><ion-icon name="card-outline"></ion-icon> Transactions</ion-label>
        </ion-item>
        <ion-item [routerLink]="['/home']">
          <ion-label><ion-icon name="chatbox-outline"></ion-icon> Chats</ion-label>
        </ion-item>
        <ion-item>
          <ion-label><ion-icon name="gift-outline"></ion-icon> Rewards</ion-label>
        </ion-item>
        <ion-item [routerLink]="['/campaign-favorite']">
          <ion-label><ion-icon name="heart-outline"></ion-icon> Favourite Projects</ion-label>
        </ion-item>
        <ion-item *ngIf="type == 'Business' or 'Fund Finders'" [routerLink]="['/event-favorite']">
          <ion-label><ion-icon name="bookmark-outline"></ion-icon> Favourite Events</ion-label>
        </ion-item>
        <ion-item [routerLink]="['/all-blogs']">
          <ion-label>Blogs</ion-label>
        </ion-item>
        <ion-item *ngIf="type == 'Business' or 'Fund Finders'" [routerLink]="['/event']">
          <ion-label>Events</ion-label>
        </ion-item>
        <ion-item>
          <ion-label>Settings</ion-label>
        </ion-item>
        <ion-button color="primary" shape="round" (click)="logout()">Log Out</ion-button>
      </ion-list>

    </ion-content> <!-- need to change -->
  </ion-menu>
  <div class="ion-page" id="main-content">
    <ion-header>
      <ion-toolbar>
        <ion-button fill="clear" class="text-cblue" slot="start">
          <ion-menu-button></ion-menu-button>
        </ion-button>
        <ion-button [routerLink]="['/user-rewards']" fill="clear" slot="end">
          <ion-icon slot="icon-only" class="text-cblue" name="notifications"></ion-icon>
        </ion-button>
        <ion-button [routerLink]="['/home']" fill="clear" slot="end">
          <ion-icon slot="icon-only" class="text-cblue" name="chatbubble-ellipses"></ion-icon>
        </ion-button>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      <p class="text-xl text-center text-dblue font-bold">BRING YOUR IDEAS TO LIFE.</p>
      <div>
        <ion-searchbar></ion-searchbar>
      </div>
    </ion-content>

  </div>

</ion-content>
