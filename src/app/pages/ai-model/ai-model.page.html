<ion-header>
  <ion-toolbar>
    <ion-title>
      Sentiment Analysis
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <form>
    <ion-item>
      <ion-label position="floating">Enter text to analyze</ion-label>
      <ion-textarea #inputText></ion-textarea>
    </ion-item>

    <ion-button expand="block" (click)="analyzeSentiment()">Analyze</ion-button>
  </form>

</ion-content>
