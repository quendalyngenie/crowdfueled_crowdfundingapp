<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Project Listing</ion-title>
    <ion-buttons slot="end">
      <ion-button color="primary" [routerLink]="['/create-project']">
        <ion-icon slot="icon-only" name="add"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content [fullscreen]="true">
  <ion-menu contentId="main-content">
    <ion-header>
      <ion-toolbar>
        <ion-title></ion-title> <!-- need to change -->
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      <ion-list lines="none">
        <ion-item [routerLink]="['/start']">
          <ion-label>Home</ion-label>
        </ion-item>
        <ion-item [routerLink]="['/account']">
          <ion-label><ion-icon name="person-outline"></ion-icon> My Account</ion-label>
        </ion-item>
        <ion-item *ngIf="type == 'Business' or 'Fund Finders'" [routerLink]="['/project-listing']">
          <ion-label><ion-icon name="book-outline"></ion-icon> Projects</ion-label>
        </ion-item>
        <ion-item *ngIf="type == 'Investor' or 'General Public'" [routerLink]="['/campaign']">
          <ion-label><ion-icon name="book-outline"></ion-icon> Projects</ion-label>
        </ion-item>
        <ion-item [routerLink]="['/transaction-history']">
          <ion-label><ion-icon name="card-outline"></ion-icon> Transactions</ion-label>
        </ion-item>
        <ion-item [routerLink]="['/home']">
          <ion-label><ion-icon name="chatbox-outline"></ion-icon> Chats</ion-label>
        </ion-item>
        <ion-item>
          <ion-label><ion-icon name="gift-outline"></ion-icon> Rewards</ion-label>
        </ion-item>
        <ion-item [routerLink]="['/campaign-favorite']">
          <ion-label><ion-icon name="heart-outline"></ion-icon> Favourite Projects</ion-label>
        </ion-item>
        <ion-item *ngIf="type == 'Business' or 'Fund Finders'" [routerLink]="['/event-favorite']">
          <ion-label><ion-icon name="bookmark-outline"></ion-icon> Favourite Events</ion-label>
        </ion-item>
        <ion-item [routerLink]="['/all-blogs']">
          <ion-label>Blogs</ion-label>
        </ion-item>
        <ion-item *ngIf="type == 'Business' or 'Fund Finders'" [routerLink]="['/event']">
          <ion-label>Events</ion-label>
        </ion-item>
        <ion-item>
          <ion-label>Settings</ion-label>
        </ion-item>
        <ion-button color="primary" shape="round" (click)="logout()">Log Out</ion-button>
      </ion-list>

    </ion-content> <!-- need to change -->
  </ion-menu>

  <ion-content>
    <ion-card *ngFor="let each of projects">
      <div class="product-card flex-none w-48 relative float-left pr-5" [routerLink]="['/project-details', each.prjId]">
        <img [src]=each.image class="image-card rounded-lg">
      </div>
      <div class="flex-auto p-6 text-dblue">
        <div class="flex flex-wrap">
          <h1 class="flex-auto text-lg font-semibold text-slate-900">{{each.title}}</h1>
          <h2 class="w-full flex-none text-sm font-medium text-slate-700 mt-2">{{each.status.toUpperCase()}}</h2>
        </div>
      </div>
    </ion-card>
  </ion-content>
