<ion-header>
  <ion-toolbar>
    <ion-title>transaction-history</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let transaction of transactions">
      <ion-label>
        <p><strong>Event:</strong> {{ transaction.event }}</p>
        <p><strong>Date:</strong> {{ transaction.date | date }}</p>
        <p><strong>Price:</strong> {{ transaction.price | currency: 'SGD' }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
