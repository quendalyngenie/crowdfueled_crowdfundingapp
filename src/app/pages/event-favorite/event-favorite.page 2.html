<ion-header>
  <ion-toolbar>
    <ion-title>
      Favorite Events
      <ion-buttons slot="start">
        <ion-back-button></ion-back-button>
      </ion-buttons>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let event of favoriteEvents" (click)="goToEventDetail(event.id)">
      {{event.name}}
    </ion-item>
  </ion-list>
</ion-content>
