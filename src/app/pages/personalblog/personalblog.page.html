<ion-header>
  <ion-toolbar>
    <ion-title>My Blogs</ion-title>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

  <ion-content>
    <ion-list>
      <ion-item *ngFor="let item of blog">
        <ion-thumbnail slot="start">
          <img [src]=item.bImage>
        </ion-thumbnail>
        <ion-label [routerLink]="['/update-blog', item.blogId]">
          <h2>Title: {{item.bTitle}}</h2>
          <p>Story: {{item.bStory}}</p>
          <p>Read Time: {{item.readTime}} Mins</p>
        </ion-label>
        <ion-icon slot="end" name="trash-bin" (click)="delete(item)"></ion-icon>
      </ion-item>
    </ion-list>
  </ion-content>
