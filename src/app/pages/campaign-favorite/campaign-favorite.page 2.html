<ion-header>
  <ion-toolbar>
    <ion-title>
      Favorite Projects
    </ion-title>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let campaign of favoriteCampaigns" (click)="goToCampaignDetail(campaign.id)">
      {{campaign.prjName}}
    </ion-item>
  </ion-list>
</ion-content>
